services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: inventory-agent-db
    environment:
      POSTGRES_DB: inventory_agent
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
