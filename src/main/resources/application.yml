spring:
  application:
    name: inventory-agent
  datasource:
    url: jdbc:postgresql://localhost:5433/inventory_agent
    username: inventory
    password: inventory
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:4b-instruct
        temperature: 0.2
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

agent:
  company-name: Inventra
  memory-max-messages: 10

logging:
  level:
    org.springframework.ai.chat.client.advisor.StructuredOutputValidationAdvisor: DEBUG